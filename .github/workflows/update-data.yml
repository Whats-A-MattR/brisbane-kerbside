name: Update council data

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch and validate every registered council
        run: pnpm data:update:all
      - name: Validate every generated site
        run: pnpm typecheck && pnpm build:all
      - name: Commit updated static data
        run: |
          if git diff --quiet -- 'sites/*/public/data'; then
            echo "Council data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'sites/*/public/data'
          git commit -m "chore(data): refresh council schedules"
          git push
