name: Deploy kerbside sites to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Update council data]
    types: [completed]
  workflow_dispatch:
  workflow_call:
    inputs:
      logan_only:
        description: Deploy only Logan and the directory
        type: boolean
        default: false
      revision:
        description: Exact source revision to deploy
        type: string
        default: ''

permissions:
  contents: read
  deployments: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.registry.outputs.sites }}
      revision: ${{ steps.registry.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || 'refs/heads/main' }}
      - id: registry
        name: Read the site registry
        env:
          LOGAN_ONLY: ${{ inputs.logan_only || false }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "sites=$(jq -c --arg only "$LOGAN_ONLY" '{include: map(select($only != "true" or .id == "logan" or .id == "master") | {id, cloudflareProject, environment: .githubEnvironment, analyticsEnabled, adsEnabled})}' sites/registry.json)" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.sites) }}
    name: Deploy ${{ matrix.id }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: cloudflare-pages-${{ matrix.id }}-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm notifications:config:check
      - run: pnpm typecheck
      - name: Build ${{ matrix.id }}
        run: pnpm build
        env:
          KERBSIDE_SITE: ${{ matrix.id }}
          VITE_GA_MEASUREMENT_ID: ${{ matrix.analyticsEnabled && vars.GA_MEASUREMENT_ID || '' }}
          VITE_ADSENSE_CLIENT: ${{ matrix.adsEnabled && vars.ADSENSE_CLIENT || '' }}
          VITE_ADSENSE_SLOT: ${{ matrix.adsEnabled && vars.ADSENSE_SLOT || '' }}
      - name: Stamp the public Logan notice version
        if: matrix.id == 'logan' || matrix.id == 'master'
        env:
          SITE: ${{ matrix.id }}
        run: |
          mkdir -p "dist/$SITE/data"
          sha256sum sites/logan/storm-notice.json | cut -d ' ' -f 1 > "dist/$SITE/data/logan-notice-version.txt"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/${{ matrix.id }} --project-name=${{ matrix.cloudflareProject }} --branch=main --commit-hash=${{ needs.prepare.outputs.revision }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
