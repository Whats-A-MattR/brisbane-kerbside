name: Check Logan Council notice

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kerbside-data-refresh
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Test and refresh the notice
        id: snapshot
        run: |
          python3 -B scripts/test-logan-notice.py
          python3 scripts/check-logan-notice.py
          if git diff --quiet -- sites/logan/storm-notice.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/logan/storm-notice.json
          git commit -m "chore(data): update Logan Council notice"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.result == 'success' && (needs.check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-cloudflare.yml
    with:
      logan_only: true
    secrets: inherit
